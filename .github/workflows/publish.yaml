name: publish

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  check:
    uses: ./.github/workflows/check.yaml
    # What check's jobs ask for. Neither job runs for a tag, but the call must allow it.
    permissions:
      contents: write # check's report job
      pull-requests: write # check's review job

  test:
    uses: ./.github/workflows/test.yaml

  # scripts/release.ant cross-compiles every target on one runner.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: build
        run: go run ./cmd/ant run scripts/release.ant "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*

  publish:
    needs: [check, test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: release
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
