<svg xmlns="http://www.w3.org/2000/svg" width="100" height="20" viewBox="0 0 100 20" role="img" aria-label="coverage: 92%">
  <defs>
    <clipPath id="coverage-clip"><rect width="100" height="20" rx="3"/></clipPath>
    <linearGradient id="coverage-label" x2="0" y2="100%">
      <stop stop-color="#475265"/>
      <stop offset="1" stop-color="#3a4557"/>
    </linearGradient>
    <linearGradient id="coverage-value" x2="0" y2="100%">
      <stop stop-color="#fff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#000" stop-opacity=".06"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#coverage-clip)">
    <rect width="64" height="20" fill="url(#coverage-label)"/>
    <rect x="64" width="36" height="20" fill="#5ec269"/>
    <rect x="64" width="36" height="20" fill="url(#coverage-value)"/>
  </g>
  <g aria-hidden="true" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11">
    <text x="7" y="14" font-weight="400" textLength="50" lengthAdjust="spacingAndGlyphs">coverage</text>
    <text x="71" y="14" font-weight="700" textLength="22" lengthAdjust="spacingAndGlyphs">92%</text>
  </g>
</svg>
